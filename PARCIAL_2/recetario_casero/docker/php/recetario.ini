; Ajustes de PHP para Recetario casero
memory_limit = 128M
max_execution_time = 60
date.timezone = America/Mexico_City
expose_php = Off

; Rendimiento: la aplicacion va dentro de la imagen y no cambia mientras corre
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0