<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieReviews - Reseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top site-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-film me-2"></i>Movie<span>Reviews</span></a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li></ul>
      <div class="input-group navbar-search me-lg-3 my-3 my-lg-0">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input id="busqueda" type="search" class="form-control" placeholder="Buscar película...">
      </div>
      <button class="btn btn-nav-favorites" id="btnFavoritos"><i class="bi bi-heart-fill me-1"></i> Favoritos <span class="badge text-bg-danger ms-1" id="contadorFavoritos">0</span></button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div id="cargando" class="text-center py-5">
    <div class="spinner-border text-dark" role="status"></div>
    <p class="mt-2">Cargando reseña...</p>
  </div>
  <div id="error" class="alert alert-danger d-none text-center">
    <i class="bi bi-exclamation-triangle me-2"></i>No fue posible cargar la película.
    <a href="index.html" class="btn btn-sm btn-danger ms-2">Volver al inicio</a>
  </div>

  <article id="detalle" class="d-none detail-panel">
    <div class="row g-4">
      <div class="col-12 col-md-4 col-lg-3">
        <img id="imagen" class="movie-poster rounded shadow-sm" alt="">
      </div>
      <div class="col-12 col-md-8 col-lg-9">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
          <div><h1 id="titulo" class="fw-bold mb-1"></h1><p class="text-muted mb-2"><span id="anio"></span> · <span id="duracion"></span></p></div>
          <button id="btnFavoritoDetalle" class="btn btn-outline-danger"><i class="bi bi-heart"></i> Favorito</button>
        </div>
        <div id="rating" class="rating fs-5 mb-3"></div>
        <strong>Géneros</strong>
        <div id="generos" class="mb-3"></div>
        <p id="descripcion" class="lead"></p>
        <strong>Intereses</strong>
        <div id="intereses" class="mb-3"></div>
        <div class="d-flex gap-2 mb-2">
          <a id="trailer" class="btn bg-danger text-white rounded-pill" target="_blank" rel="noopener"><i class="bi bi-play-fill"></i> Ver tráiler</a>
          <a href="index.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>
        <strong>Enlaces externos</strong>
        <div id="enlaces" class="mb-3"></div>
        <div class="row g-3 mt-2">
          <div class="col-12"><strong>Metascore</strong><span id="metaNumero" class="float-end"></span><div class="progress mt-2"><div id="metascore" class="progress-bar" role="progressbar"></div></div></div>
        </div>
      </div>
    </div>

    <hr class="my-4">
    <div class="row g-3">
      <div class="col-12 col-md-6"><strong>Idiomas</strong><p id="idiomas" class="mb-0"></p></div>
      <div class="col-12 col-md-6"><strong>Países de origen</strong><p id="paises" class="mb-0"></p></div>
      <div class="col-12 col-md-6"><strong>Clasificación</strong><p id="clasificacion" class="mb-0"></p></div>
      <div class="col-12 col-md-6"><strong>Presupuesto</strong><p id="presupuesto" class="mb-0"></p></div>
      <div class="col-12 col-md-6"><strong>Recaudación</strong><p id="recaudacion" class="mb-0"></p></div>
      <div class="col-12"><strong>Productoras</strong><p id="productoras" class="mb-0"></p></div>
    </div>
  </article>
</main>

<div class="modal fade" id="modalFavoritos" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-heart-fill text-danger me-2"></i>Mis favoritos</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div id="listaFavoritos" class="row g-3"></div><div id="sinFavoritos" class="text-center text-muted py-4 d-none"><i class="bi bi-heart fs-1"></i><p class="mt-2">No tienes películas favoritas.</p></div></div>
    <div class="modal-footer"><button id="eliminarTodos" class="btn btn-outline-danger">Eliminar todos</button></div>
  </div></div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/jquery.js"></script>
</body>
</html>
