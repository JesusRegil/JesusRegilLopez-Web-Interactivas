<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div
        class="container"
    >
        <h1 class="bg-black text-white p-3 rounded">Tarea 2 - Aplicaciones Web Interactivas</h1>
    </div>

    <div 
        class="container bg-light p-4 rounded mt-4 border border-2 border-primary col-md-6 offset-md-3"
    >
        <div class="row center align-items-center">
            <div class="column text-center">
                <img src="imagenes/homero.jpg" alt="Homero" class="img-fluid rounded-circle shadow" style="max-width: 150px;">
            </div>
        </div>
        <div class="row mt-3">
            <div class="column text-center">
                <h2 class="text-primary fw-bold">Homero Simpson</h2>
                <p class="text-muted">Desarrollador de software</p>
            </div>
        </div>
        <div class="row mt-3">
            <div class="column d-flex justify-content-center gap-2 text-white justify-content-center fw-bold">
                 <div class="bg-primary p-2 rounded-3">HTML</div>
                 <div class="bg-success p-2 rounded-3">CSS</div>
                 <div class="bg-danger p-2 rounded-3">JavaScript</div>
                 <div class="bg-info p-2 rounded-3">Bootstrap</div>
                 <div class="bg-dark p-2 rounded-3">React</div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="column text-center mt-3 gap-2 align-items-center">
                <a href="#" class="btn btn-light bg-light border border-1 border-primary text-primary d-flex justify-content-center gap-2"><i class="bi bi-envelope-fill bi-primary"></i> Contactar</a>
            </div>
        </div>
    </div>
    
</body>
</html>
